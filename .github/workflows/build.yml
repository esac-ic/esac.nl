name: Build, Test & Deploy

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_HOST: 127.0.0.1
  DB_DATABASE: esac
  DB_USERNAME: mysql
  DB_PASSWORD: mysql
  HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

jobs:
  tests:
    name: Build front-end & run tests
    runs-on: ubuntu-latest
    environment: Build
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_USER: ${{ env.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-retries=20
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Audit PHP dependencies
      run: composer audit

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: PHP artisan setup
      run: |
        php artisan key:generate
        php artisan storage:link
        php artisan migrate --seed

    - name: NPM build
      run: npm run prod

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      run: vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage.xml

    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: env.HAS_CODECOV_TOKEN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true

  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        coverage: none

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Check the code style
      run: composer lint -- --test

  larastan:
    name: Larastan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        coverage: none

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Analyse the code
      run: composer analyse -- --no-progress --error-format=github

  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [tests, pint, larastan]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=${{ github.run_number }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: ${{ github.event_name != 'pull_request' }}
        pull: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://esac.nl
    concurrency: production
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Deploy via SSH
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        IMAGE: ghcr.io/${{ github.repository }}:${{ github.run_number }}
      run: |
        install -m 700 -d ~/.ssh
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        scp compose.yaml infra/backup.sh "ic@$SSH_HOST:/srv/esac/"
        ssh "ic@$SSH_HOST" "set -e; cd /srv/esac
          APP_IMAGE=$IMAGE docker compose pull app
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|' .env
          ./backup.sh < /dev/null
          docker compose up -d
          docker compose exec -T app php artisan migrate --force < /dev/null
          docker compose exec -T app php artisan optimize < /dev/null
          docker compose exec -T app php artisan reload < /dev/null
          docker image prune -af --filter until=168h"

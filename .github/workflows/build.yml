name: Build, Test & Deploy

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
  # Runs a command in the dev app container without the dev entrypoint's setup
  RUN: docker compose run --rm --no-deps --entrypoint docker-php-entrypoint app

jobs:
  # Runs in the same Docker setup as `./dev up`, whose image shares its base with the production image,
  # so the PHP, Node and MySQL versions come from the Dockerfile and compose.yaml alone
  tests:
    name: Build front-end & run tests
    runs-on: ubuntu-latest
    environment: Build
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure the dev setup
      run: |
        cp .env.example .env
        printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build the dev image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        target: dev
        load: true
        tags: esac-app-dev
        cache-from: type=gha,scope=dev
        cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=dev,mode=max' || '' }}

    - name: Start MySQL
      run: docker compose up --detach --wait mysql

    - name: Install the dependencies
      run: |
        $RUN composer install --no-interaction --no-progress
        $RUN php artisan key:generate
        docker compose run --rm --no-deps assets "npm ci --no-audit --no-fund && npm run build"

    - name: Run the tests
      run: $RUN env XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage.xml

    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: env.HAS_CODECOV_TOKEN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true

  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=${{ github.run_number }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        target: production
        push: ${{ github.event_name != 'pull_request' }}
        pull: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=production
        cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=production,mode=max' || '' }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://esac.nl
    concurrency: production
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Deploy via SSH
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        IMAGE: ghcr.io/${{ github.repository }}:${{ github.run_number }}
      run: |
        install -m 700 -d ~/.ssh
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        scp compose.yaml infra/backup.sh "ic@$SSH_HOST:/srv/esac/"
        ssh "ic@$SSH_HOST" "set -e; cd /srv/esac
          APP_IMAGE=$IMAGE docker compose pull app
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|' .env
          ./backup.sh < /dev/null
          docker compose up -d
          docker compose exec -T app php artisan migrate --force < /dev/null
          docker compose exec -T app php artisan optimize < /dev/null
          docker compose exec -T app php artisan view:cache < /dev/null"

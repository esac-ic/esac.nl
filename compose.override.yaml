# Local dev only: Compose loads this automatically, so never copy it to the production server

# Your user id, so created files are yours (on Linux, set UID/GID in .env if `id -u` isn't 1000)
x-user: &user "${UID:-1000}:${GID:-1000}"

# Production settings from compose.yaml that don't apply in dev
x-dev-environment: &dev-environment
  LOG_CHANNEL: !reset null
  VIEW_COMPILED_PATH: !reset null

services:
  app:
    image: esac-app-dev
    build:
      context: .
      target: dev
    user: *user
    # Laravel reads the mounted .env itself, so edits apply without recreating the container
    env_file: !reset []
    environment:
      <<: *dev-environment
      # Any host, so 127.0.0.1 and your LAN IP work too
      SERVER_NAME: :80
      CADDY_EXTRA_CONFIG: ""
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=host.docker.internal
      # Plain http, so browsers keep the session cookie on a LAN IP too (localhost is exempt)
      SESSION_SECURE_COOKIE: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports: !override
      - "${FORWARD_HOST:-127.0.0.1}:${APP_PORT:-8000}:80"
    volumes: !override
      - .:/app
    restart: !reset
    # Lets `up --wait` return once the site loads; the first start takes a few minutes
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost/up"]
      start_period: 10m
      start_interval: 2s
    depends_on:
      mailpit:
        condition: service_started
      mailman-setup:
        condition: service_completed_successfully

  # Vite dev server: CSS changes apply live, Blade/JS changes reload the page
  assets:
    image: esac-app-dev
    build:
      context: .
      target: dev
    user: *user
    volumes:
      - .:/app
      # Its own Linux packages, so they don't clash with a node_modules installed on the host
      - node-modules:/app/node_modules
    ports:
      - "${FORWARD_HOST:-127.0.0.1}:${VITE_PORT:-5173}:5173"
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_HOST: ${VITE_HOST:-localhost}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ package-lock.json -ot node_modules/.package-lock.json ] || npm ci --no-audit --no-fund
        exec node_modules/.bin/vite
    # The image's healthcheck probes FrankenPHP, which doesn't run here
    healthcheck:
      disable: true

  worker: &dev-artisan
    image: esac-app-dev
    user: *user
    env_file: !reset []
    environment: *dev-environment
    entrypoint: ["docker-php-entrypoint"]
    volumes: !override
      - .:/app
    restart: !reset
    depends_on:
      app:
        condition: service_healthy

  scheduler: *dev-artisan

  mysql:
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    # Creates the test database along with a new volume
    configs:
      - source: test-db
        target: /docker-entrypoint-initdb.d/test-db.sql
    restart: !reset

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

  mailman:
    image: maxking/mailman-core:0.5
    hostname: mailman
    environment:
      MM_HOSTNAME: "0.0.0.0"
      MAILMAN_REST_USER: ${MAILMAN_USERNAME}
      MAILMAN_REST_PASSWORD: ${MAILMAN_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_MAILMAN_PORT:-8001}:8001"
    volumes:
      - mailman-data:/opt/mailman
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8001"]
      start_period: 2m
      start_interval: 2s

  # Creates the mailing lists the member sync expects, if missing
  mailman-setup:
    image: curlimages/curl:8.11.1
    environment:
      AUTH: ${MAILMAN_USERNAME}:${MAILMAN_PASSWORD}
      API: ${MAILMAN_URL}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        curl -sfu "$$AUTH" "$$API/domains/esac.nl" -o /dev/null \
          || curl -sfu "$$AUTH" "$$API/domains" -d mail_host=esac.nl -o /dev/null
        for list in alle-leden nieuwsbrief reunist; do
          curl -sfu "$$AUTH" "$$API/lists/$$list@esac.nl" -o /dev/null \
            || curl -sfu "$$AUTH" "$$API/lists" -d "fqdn_listname=$$list@esac.nl" -o /dev/null
        done
    depends_on:
      mailman:
        condition: service_healthy

configs:
  test-db:
    content: |
      CREATE DATABASE IF NOT EXISTS esac_testing;
      GRANT ALL ON esac_testing.* TO '${DB_USERNAME}'@'%';

volumes:
  mailman-data:
  node-modules:

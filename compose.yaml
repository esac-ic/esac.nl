name: esac

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/esac-ic/esac.nl:latest}
  env_file: .env
  environment: &app-environment
    LOG_CHANNEL: stderr
    SESSION_SECURE_COOKIE: "true"
  volumes:
    - app-storage:/app/storage
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      SERVER_NAME: ${APP_DOMAIN:-esac.nl}
      CADDY_EXTRA_CONFIG: |
        www.${APP_DOMAIN:-esac.nl} {
          redir https://${APP_DOMAIN:-esac.nl}{uri} permanent
        }
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        header X-Frame-Options "SAMEORIGIN"
        header X-Content-Type-Options "nosniff"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app-storage:/app/storage
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk --resolve \"$${SERVER_NAME}:443:127.0.0.1\" \"https://$${SERVER_NAME}/up\" > /dev/null"]
      interval: 30s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work"]
    # The image's health check probes Caddy, which only runs in the app service
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=30
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      retries: 12
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  caddy-data:
  caddy-config:

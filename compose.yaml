name: esac

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/esac-ic/esac.nl:latest}
  env_file: .env
  environment: &app-environment
    LOG_CHANNEL: stderr
    SESSION_SECURE_COOKIE: "true"
    VIEW_COMPILED_PATH: /tmp/views
  volumes:
    - app-storage:/app/storage
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      SERVER_NAME: ${APP_DOMAIN:-esac.nl}
      CADDY_EXTRA_CONFIG: |
        www.${APP_DOMAIN:-esac.nl} {
          redir https://${APP_DOMAIN:-esac.nl}{uri} permanent
        }
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        header X-Frame-Options "SAMEORIGIN"
        header X-Content-Type-Options "nosniff"
        header Strict-Transport-Security "max-age=31536000"
        # Vite puts a content hash in the built assets' file names
        @versioned {
          path /build/assets/*
          file
        }
        header @versioned Cache-Control "public, max-age=31536000, immutable"
        # Uploads are served as files, never run as PHP; thumbnails are replaced under the same name
        @storage path /storage/*
        header @storage Cache-Control "public, max-age=3600"
        handle @storage {
          file_server
        }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app-storage:/app/storage
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk --resolve \"$${SERVER_NAME}:443:127.0.0.1\" \"https://$${SERVER_NAME}/up\" > /dev/null"]
      interval: 30s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    # Restarts hourly (compose brings it back) and gives up on a job after 3 tries; image conversions need more memory than web requests
    command: ["php", "-d", "memory_limit=256M", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    # The image's health check probes Caddy, which only runs in the app service; check the database connection instead
    healthcheck: &artisan-healthcheck
      test: ["CMD", "php", "artisan", "db:monitor"]
      interval: 60s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck: *artisan-healthcheck

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=30
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      retries: 12
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  caddy-data:
  caddy-config:
